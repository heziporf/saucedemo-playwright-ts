name: Update visual baselines

# Run manually after an intended UI change. Creates the Linux screenshots inside the same
# Docker image the visual job uses, then commits them. Known-bug tests are excluded on purpose:
# VIS-05 compares visual_user against the standard baseline and must never overwrite it.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright test --project=visual --grep-invert @known-bug --update-snapshots=all
      - name: Commit the new baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          git diff --cached --quiet || git commit -m "test(visual): update visual baselines"
          git push
